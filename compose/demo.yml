# Reproducible demonstration overlay for the standard docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.yml -f compose/demo.yml up -d
services:
  demo-seed:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./scripts/demo-seed.sh:/demo-seed.sh:ro
    entrypoint: ["bash", "/demo-seed.sh"]
    restart: "no"

  agent:
    depends_on:
      - explorer
      - demo-seed
    environment:
      # Keep the normal agent configuration, but declare four explicit processes for the demo.
      # The hints tell the supervised cycle which Kafka evidence to inspect; they do not hard-code
      # a diagnosis or bypass MCP.
      SPRING_APPLICATION_JSON: >-
        {"kex":{"agent":{"supervision":{"processes":[
          {"id":"demo-nominal","name":"Demo · Flux nominal","description":"Flux de référence alimenté régulièrement","hint":"topics [demo.nominal] ; privilégie kex_process_health et kex_topic_activity."},
          {"id":"demo-empty","name":"Demo · Topic vide","description":"Topic volontairement vide","hint":"topics [demo.empty] ; utilise kex_process_health et kex_topic_activity pour distinguer vide de non mesuré."},
          {"id":"demo-stalled","name":"Demo · Flux interrompu","description":"Flux ayant émis puis cessé","hint":"topics [demo.stalled] ; utilise kex_topic_activity pour comparer activité récente et dernier message observé."},
          {"id":"demo-lag","name":"Demo · Consumer en retard","description":"Consumer volontairement derrière le flux","hint":"topics [demo.lag] ; consumer group demo-slow-consumer ; utilise kex_process_health puis kex_diagnose_consumer."}
        ]}}}}
