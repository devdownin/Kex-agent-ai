# Stack complète : un broker Kafka, Kafka SQL Explorer (image publiée) avec son serveur MCP
# activé, et l'agent branché dessus.
#
#   export ANTHROPIC_API_KEY=sk-ant-...
#   export EXPLORER_MCP_AUTH_TOKEN="$(openssl rand -hex 32)"
#   docker compose up -d
#
# Explorer sur http://localhost:8080, agent sur http://localhost:8081.
services:
  # L'image apache/kafka tourne en `appuser` mais Docker crée le volume nommé en root :
  # un chown unique avant le démarrage du broker.
  kafka-data-init:
    image: apache/kafka:4.3.1
    user: root
    volumes:
      - kafka_data:/var/lib/kafka/data
    entrypoint: ["sh", "-c", "chown -R appuser:appuser /var/lib/kafka/data"]

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    # Un nœud KRaft qui s'arrête vide ses logs et ferme proprement ses coordinateurs ;
    # les 10s par défaut le tuent en plein flush et rallongent le démarrage suivant.
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU2OhlMTT69sPFvS1n16g"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  explorer:
    # `latest` par défaut, comme demandé. Épingler une version (EXPLORER_IMAGE_TAG=2.0.0)
    # pour un environnement reproductible : `latest` sert ce qui a été publié le jour du pull.
    image: ${EXPLORER_IMAGE_NAMESPACE:-compagnonsdudev}/kafkaexplorer:${EXPLORER_IMAGE_TAG:-latest}
    ports:
      # Boucle locale : l'Explorer n'authentifie personne et POST /api/config peut repointer
      # le cluster à chaud. BIND_ADDR=0.0.0.0 pour l'exposer délibérément.
      - "${BIND_ADDR:-127.0.0.1}:${EXPLORER_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP_PROTOCOL: consumer
      # Serveur MCP : livré éteint, c'est ce bloc qui l'allume.
      EXPLORER_MCP_ENABLED: "true"
      EXPLORER_MCP_AUTH_TOKEN: ${EXPLORER_MCP_AUTH_TOKEN:?requis, generer avec openssl rand -hex 32}
      # Exception explicite : stack en clair sur la boucle locale. Partout ailleurs, laisser
      # l'exigence TLS active et terminer TLS devant.
      EXPLORER_MCP_REQUIRE_TLS: "false"
      EXPLORER_MCP_READONLY: "${EXPLORER_MCP_READONLY:-true}"
    volumes:
      - explorer_logs:/app/logs
      - explorer_data:/app/data
    # 15s d'arrêt web gracieux puis ~10s de destruction des beans, plus la sortie JVM.
    stop_grace_period: 35s
    restart: unless-stopped

  agent:
    build: .
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KEX_AGENT_PORT:-8081}:8081"
    # `service_started`, pas `service_healthy` : les clients MCP sont initialisés
    # paresseusement, l'agent démarre donc avant l'Explorer et se rattache à sa première
    # requête. Attendre la sonde de l'Explorer coûterait une minute pour rien.
    depends_on:
      - explorer
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?requis, cle Anthropic de l-agent}
      # Bearer exigé sur /api/** : sans lui l'agent répond 503 et ne sert personne.
      KEX_AGENT_API_KEY: ${KEX_AGENT_API_KEY:?requis, generer avec openssl rand -hex 32}
      # Le token doit être identique des deux côtés : c'est le même bearer.
      EXPLORER_MCP_AUTH_TOKEN: ${EXPLORER_MCP_AUTH_TOKEN:?requis, generer avec openssl rand -hex 32}
      KAFKA_EXPLORER_URL: http://explorer:8080
    healthcheck:
      # /dev/tcp plutôt qu'un appel à /actuator/health : l'image JRE n'a ni curl ni wget,
      # et la sonde ne vaut pas une couche apt de plus.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  kafka_data:
  explorer_logs:
  explorer_data:
