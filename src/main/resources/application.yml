server:
  # 8080 est pris par Kafka SQL Explorer sur un poste de dev.
  port: ${KEX_AGENT_PORT:8081}

spring:
  application:
    name: kex-agent-ai
  threads:
    # Java 25 : un échange qui attend le modèle et ses outils immobilise une pile, pas un thread noyau.
    virtual:
      enabled: true
  mvc:
    async:
      # Au-delà de kex.agent.request-timeout, pour que ce soit l'agent qui rende un événement
      # `error` explicite plutôt que le conteneur qui coupe la connexion sans rien dire.
      request-timeout: 150s
  autoconfigure:
    # Mémoire de conversation en mémoire process par défaut : aucune base à installer pour
    # lancer l'agent. Le profil `shared-memory` lève ces exclusions et bascule sur PostgreSQL,
    # seul moyen de faire tourner plusieurs instances derrière un load balancer.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
  ai:
    model:
      # Le fournisseur du modèle de conversation. Deux autoconfigurations sont sur le classpath
      # (Anthropic et OpenAI/OpenRouter) : sans cette propriété elles s'activeraient toutes les
      # deux — leur condition vaut matchIfMissing — et le contexte ne saurait plus quel ChatModel
      # injecter. `anthropic` ou `openai`.
      chat: ${KEX_AGENT_LLM_PROVIDER:anthropic}
      # Le starter OpenAI apporte aussi des modèles d'embeddings, d'images et d'audio, activés par
      # défaut dès qu'il est sur le classpath. Éteints ici : ils exigeraient une clé OpenAI au
      # démarrage, et un EmbeddingModel apparu sans qu'on le demande satisferait en silence la
      # base de connaissance, qui doit rester un choix explicite. Même piège que le starter JDBC.
      embedding: ${KEX_AGENT_EMBEDDING_PROVIDER:none}
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

    anthropic:
      # Vide accepté : une installation qui tourne sur OpenRouter n'a pas de clé Anthropic à
      # fournir. Le fournisseur retenu sans clé est signalé au démarrage par LlmProviderCheck.
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-opus-5
          max-tokens: 4096
          temperature: 0.2

    openai:
      # OpenRouter : une passerelle hébergée devant les modèles de la plupart des fournisseurs.
      # Ce qu'elle coûte est dit plutôt que sous-entendu — les prompts et les résultats d'outils
      # quittent la machine, et transitent par un tiers de plus qu'avec un appel direct.
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        options:
          # OpenRouter nomme ses modèles fournisseur/modèle. Celui-ci sait appeler des outils, ce
          # dont cet agent ne peut pas se passer : sans appel d'outils il ne sert plus à rien — et
          # sur le tiers gratuit, il applique le schéma de la sortie structurée du cycle plutôt que
          # de s'en approcher, ce que le tiers gratuit de Qwen3-235B, par exemple, ne garantit pas.
          model: ${OPENROUTER_MODEL:openai/gpt-oss-120b:free}
          max-tokens: 4096
          temperature: 0.2
    tools:
      limits:
        # Sans plafond, un modèle qui boucle sur un outil tourne jusqu'au timeout HTTP, à nos frais.
        # RETURN_ERROR_RESPONSE plutôt que THROW : le modèle reçoit l'erreur et conclut, là où
        # l'exception rendrait une 500 sans réponse à l'appelant.
        max-total-tool-calls: 20
        on-limit-exceeded: return_error_response
    mcp:
      client:
        name: kex-agent
        version: 0.1.0
        type: sync
        request-timeout: 60s
        # Initialisation paresseuse : un serveur MCP distant indisponible ferait sinon échouer
        # le démarrage de l'agent. McpToolCatalog retente à chaque accès.
        initialized: false
        toolcallback:
          enabled: true
        # Serveurs MCP locaux (processus enfant, protocole stdio) — exemple, décommenter au besoin
        stdio:
          connections: {}
            # filesystem:
            #   command: npx
            #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
        # Serveurs MCP distants (HTTP streamable)
        streamable-http:
          connections:
            # Kafka SQL Explorer (devdownin/Kafkaexplorer) : serveur MCP in-process du JAR,
            # à démarrer avec EXPLORER_MCP_ENABLED=true et EXPLORER_MCP_AUTH_TOKEN.
            kafka-explorer:
              url: ${KAFKA_EXPLORER_URL:http://localhost:8080}
              endpoint: /mcp

kex:
  mcp:
    # Le transport MCP n'a pas de propriété d'en-tête : le jeton est injecté par
    # McpBearerTokenCustomizer, restreint au préfixe d'URL pour ne pas le diffuser ailleurs.
    bearer-tokens:
      - url-prefix: ${KAFKA_EXPLORER_URL:http://localhost:8080}
        token: ${EXPLORER_MCP_AUTH_TOKEN:}

  agent:
    request-timeout: 120s

    kafka:
      # Vue technique du cluster, adossée aux outils de Kafka SQL Explorer. Les noms d'outils sont
      # configurables et non codés en dur : l'agent peut être branché sur un autre serveur MCP, et
      # une vue qui échoue en nommant l'outil attendu se règle, là où une vue qui échoue en silence
      # se contourne. Connexion vide : la vue se déclare non configurée plutôt que d'afficher un
      # écran vide qu'on lirait comme « aucun topic ».
      connection: kafka-explorer
      topics-tool: kex_list_topics
      lag-tool: kex_consumer_lag
      max-topics: 200
    knowledge:
      # Éteinte : elle exige un modèle d'embeddings, donc une infrastructure que l'agent n'impose
      # pas pour démarrer. Voir docs/CONNAISSANCE.md pour l'allumer.
      enabled: false
      top-k: 4
      similarity-threshold: 0.6
      store-path: ""

    supervision:
      # Le Control Center : observer, comprendre, décider, agir, vérifier. Allumé par défaut — il
      # n'exige aucune infrastructure de plus que l'agent lui-même.
      enabled: true
      # Rien n'est surveillé tant que rien n'est déclaré : l'agent ne devine pas les processus
      # d'intégration d'une installation, et un tableau de bord vide vaut mieux qu'inventé.
      processes: []
        # - id: order-integration
        #   name: Order Integration
        #   description: Commandes reçues du site vers l'ERP
        #   hint: topic integration.events, consumer group integration-consumer
      # Le mode ne peut que restreindre l'autonomie déclarée d'une capacité, jamais l'élargir.
      mode: SUPERVISED
      # En deçà, une action autonome repasse en validation humaine plutôt que de s'exécuter.
      confidence-threshold: 0.85
      thresholds:
        consumer-lag: 1000
        error-rate-percent: 2.0
        processing-time: 5m
        blocked-messages: 50
        observation-window: 15m
      # Toute capacité non citée est interdite. Même posture que l'API, qui refuse sans clé
      # plutôt que de s'ouvrir : le droit d'agir ne s'hérite pas d'une installation.
      autonomy: {}
        # NOTIFY: AUTOMATIC
        # RESTART_CONSUMER: SUPERVISED
      # Plancher de confiance propre à une capacité : « redémarrer un consumer » mérite plus de
      # certitude que « notifier ». Un réglage ici ne peut que relever le plancher global, jamais
      # l'abaisser — sinon il affaiblirait en silence la garantie que le plancher global porte.
      confidence-thresholds: {}
        # RESTART_CONSUMER: 0.95
      # Sans outil lié, une capacité reste recommandable mais inexécutable — et le dit.
      # Le serveur MCP de Kafka SQL Explorer n'expose que des outils de lecture : aucune capacité
      # n'y a de contrepartie, et devant lui l'agent observe sans agir. Lier une action suppose un
      # autre serveur MCP (ordonnanceur, runbook, ITSM).
      actions: {}
        # RESTART_CONSUMER:
        #   connection: mon-ordonnanceur
        #   tool: restart_consumer_group
      # Historique en mémoire du processus, donc mono-instance. Voir docs/ARCHITECTURE.md.
      history-size: 200
      # Une validation arrivée bien après les faits agirait sur une situation qui n'existe plus.
      approval-timeout: 30m
      # Au-delà, l'interface signale des données potentiellement obsolètes.
      stale-after: 15m

    rate-limit:
      # Limite d'instance, pas par appelant : le bearer est unique et partagé. Elle protège le
      # budget ; en multi-instance, diviser le seuil par le nombre de répliques.
      enabled: true
      requests-per-minute: 60
      burst: 20
    max-history-messages: 40
    log-interactions: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Les routes sont peu nombreuses : les déplier évite un clic pour rien.
    doc-expansion: list

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # Distingue les instances dans un Prometheus partagé.
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

  # /actuator/prometheus n'est pas en permitAll : il porte le modèle utilisé, le volume de jetons
  # et les outils appelés. Le scraper doit présenter le même bearer que l'API.
