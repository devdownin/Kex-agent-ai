server:
  # 8080 est pris par Kafka SQL Explorer sur un poste de dev.
  port: ${KEX_AGENT_PORT:8081}

spring:
  application:
    name: kex-agent-ai
  threads:
    # Java 25 : un échange qui attend le modèle et ses outils immobilise une pile, pas un thread noyau.
    virtual:
      enabled: true
  mvc:
    async:
      # Au-delà de kex.agent.request-timeout, pour que ce soit l'agent qui rende un événement
      # `error` explicite plutôt que le conteneur qui coupe la connexion sans rien dire.
      request-timeout: 150s
  autoconfigure:
    # Mémoire de conversation en mémoire process par défaut : aucune base à installer pour
    # lancer l'agent. Le profil `shared-memory` lève ces exclusions et bascule sur PostgreSQL,
    # seul moyen de faire tourner plusieurs instances derrière un load balancer.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
  ai:
    model:
      # Le fournisseur du modèle de conversation. Deux autoconfigurations sont sur le classpath
      # (Anthropic et OpenAI/OpenRouter) : sans cette propriété elles s'activeraient toutes les
      # deux — leur condition vaut matchIfMissing — et le contexte ne saurait plus quel ChatModel
      # injecter. `anthropic` ou `openai`.
      chat: ${KEX_AGENT_LLM_PROVIDER:anthropic}
      # Le starter OpenAI apporte aussi des modèles d'embeddings, d'images et d'audio, activés par
      # défaut dès qu'il est sur le classpath. Éteints ici : ils exigeraient une clé OpenAI au
      # démarrage, et un EmbeddingModel apparu sans qu'on le demande satisferait en silence la
      # base de connaissance, qui doit rester un choix explicite. Même piège que le starter JDBC.
      embedding: ${KEX_AGENT_EMBEDDING_PROVIDER:none}
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

    anthropic:
      # Vide accepté : une installation qui tourne sur OpenRouter n'a pas de clé Anthropic à
      # fournir. Le fournisseur retenu sans clé est signalé au démarrage par LlmProviderCheck.
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-opus-5
          max-tokens: 4096
          temperature: 0.2
          # Le prompt système et les définitions d'outils ne changent pas d'un tour à l'autre d'un
          # même échange, mais tools/list est rejoué à chaque requête (voir ARCHITECTURE.md) : sans
          # cache, ce contenu est refacturé en entier à chaque appel. En dessous du seuil minimal
          # d'Anthropic (~1024 tokens selon le modèle), la pose du point de cache est ignorée sans
          # erreur — l'activer ici ne coûte rien sur un petit prompt système isolé.
          cache-options:
            strategy: SYSTEM_AND_TOOLS

    openai:
      # OpenRouter : une passerelle hébergée devant les modèles de la plupart des fournisseurs.
      # Ce qu'elle coûte est dit plutôt que sous-entendu — les prompts et les résultats d'outils
      # quittent la machine, et transitent par un tiers de plus qu'avec un appel direct.
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        options:
          # OpenRouter nomme ses modèles fournisseur/modèle. Celui-ci sait appeler des outils, ce
          # dont cet agent ne peut pas se passer : sans appel d'outils il ne sert plus à rien — et
          # sur le tiers gratuit, il applique le schéma de la sortie structurée du cycle plutôt que
          # de s'en approcher, ce que le tiers gratuit de Qwen3-235B, par exemple, ne garantit pas.
          model: ${OPENROUTER_MODEL:openai/gpt-oss-120b:free}
          max-tokens: 4096
          temperature: 0.2
    tools:
      limits:
        # Sans plafond, un modèle qui boucle sur un outil tourne jusqu'au timeout HTTP, à nos frais.
        # RETURN_ERROR_RESPONSE plutôt que THROW : le modèle reçoit l'erreur et conclut, là où
        # l'exception rendrait une 500 sans réponse à l'appelant.
        max-total-tool-calls: 20
        on-limit-exceeded: return_error_response
    mcp:
      client:
        name: kex-agent
        # Filtrée par Maven depuis la même source que build-info et le JAR. Un tag de release
        # réaligne cette version via versions:set avant le packaging (voir publish.yml).
        version: "@project.version@"
        type: sync
        request-timeout: 60s
        # Initialisation paresseuse : un serveur MCP distant indisponible ferait sinon échouer
        # le démarrage de l'agent. McpToolCatalog retente à chaque accès.
        initialized: false
        toolcallback:
          enabled: true
        # Serveurs MCP locaux (processus enfant, protocole stdio) — exemple, décommenter au besoin
        stdio:
          connections: {}
            # filesystem:
            #   command: npx
            #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
        # Serveurs MCP distants (HTTP streamable)
        streamable-http:
          connections:
            # Kafka SQL Explorer (devdownin/Kafkaexplorer) : serveur MCP in-process du JAR,
            # à démarrer avec EXPLORER_MCP_ENABLED=true et EXPLORER_MCP_AUTH_TOKEN.
            kafka-explorer:
              url: ${KAFKA_EXPLORER_URL:http://localhost:8080}
              endpoint: /mcp

kex:
  resilience:
    # Disjoncteur et réessai des intégrations externes (serveurs MCP, fournisseur du modèle). Les
    # exceptions qui comptent comme échec ou déclenchent un réessai sont fixées en code, par
    # instance (mcp-tool, agent-model) : voir ResilienceConfig.
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    permitted-calls-in-half-open-state: 3
    retry-max-attempts: 3
    retry-wait-duration: 500ms

  mcp:
    # Le transport MCP n'a pas de propriété d'en-tête : le jeton est injecté par
    # McpBearerTokenCustomizer, restreint au préfixe d'URL pour ne pas le diffuser ailleurs.
    bearer-tokens:
      - url-prefix: ${KAFKA_EXPLORER_URL:http://localhost:8080}
        token: ${EXPLORER_MCP_AUTH_TOKEN:}
    runtime:
      # Les serveurs ajoutés dans la console ne sont persistés que si cette clé est fournie.
      # Le fichier est chiffré en AES-GCM ; sans clé, aucune valeur sensible ne touche le disque.
      storage-key: ${KEX_MCP_STORAGE_KEY:}
      storage-path: ${KEX_MCP_STORAGE_PATH:.kex/mcp-servers.enc}
      request-timeout: 30s
      health-history-size: 50
      # Ajouter explicitement les exécutables que l'API ADMIN peut lancer (ex. npx, uvx, docker).
      # Vide par défaut : une clé d'administration compromise ne devient pas un shell distant.
      # « docker » doit y figurer explicitement pour installer un candidat OCI du catalogue de
      # découverte ci-dessous — la note de confiance ne remplace jamais cette liste blanche.
      allowed-stdio-commands: ${KEX_MCP_STDIO_ALLOWED_COMMANDS:}
    catalog:
      trust:
        # Seuils du calcul de confiance (McpTrustScoreCalculator) : aucun ne prétend mesurer ce
        # que les sources ci-dessous n'exposent pas elles-mêmes — voir la javadoc du calculateur.
        maintenance-window: 180d
        minimal-permissions-secret-threshold: 2
        max-required-secrets: 5
        min-documented-description-length: 40
        min-adoption-pull-count: 1000
        # Vide par défaut : aucune source ne porte de statut d'éditeur vérifié, et le deviner
        # depuis un nom d'organisation inventerait une confiance que personne n'a accordée.
        trusted-publisher-repositories: []
      sources:
        # Éteintes par défaut, comme chaque extension qui ajoute une sortie réseau propre à
        # l'agent : interroger un registre tiers est un choix d'opérateur.
        docker:
          enabled: ${KEX_MCP_CATALOG_DOCKER_ENABLED:false}
          base-url: ${KEX_MCP_CATALOG_DOCKER_BASE_URL:https://hub.docker.com}
        official-registry:
          enabled: ${KEX_MCP_CATALOG_OFFICIAL_REGISTRY_ENABLED:false}
          base-url: ${KEX_MCP_CATALOG_OFFICIAL_REGISTRY_BASE_URL:https://registry.modelcontextprotocol.io}

  agent:
    request-timeout: 120s

    # Bearer historique, sous le principal anonyme "kex-agent-api". Vide, /api/** répond 503.
    api-key: ${KEX_AGENT_API_KEY:}
    # Clés nommées, en plus ou à la place d'api-key : chaque nom devient le principal authentifié,
    # donc l'acteur inscrit à l'audit de supervision plutôt qu'un jeton unique qui ne distingue
    # personne. Vide par défaut ; un seul opérateur n'a besoin de rien nommer.
    api-keys: {}
      # ops-console: ${KEX_AGENT_API_KEY_OPS:}
      # ci-pipeline: ${KEX_AGENT_API_KEY_CI:}
    # Une clé nommée absente de cette map est limitée au chat. OPERATOR peut piloter les cycles et
    # décisions ; ADMIN peut en plus modifier la politique, la connaissance et appeler MCP en direct.
    # La clé historique api-key reste ADMIN pour compatibilité.
    api-key-roles: {}
      # ops-console: OPERATOR
      # ci-pipeline: CHAT

    kafka:
      # Vue technique du cluster, adossée aux outils de Kafka SQL Explorer. Les noms d'outils sont
      # configurables et non codés en dur : l'agent peut être branché sur un autre serveur MCP, et
      # une vue qui échoue en nommant l'outil attendu se règle, là où une vue qui échoue en silence
      # se contourne. Connexion vide : la vue se déclare non configurée plutôt que d'afficher un
      # écran vide qu'on lirait comme « aucun topic ».
      connection: kafka-explorer
      topics-tool: kex_list_topics
      lag-tool: kex_consumer_lag
      max-topics: 200
    knowledge:
      # Éteinte : elle exige un modèle d'embeddings, donc une infrastructure que l'agent n'impose
      # pas pour démarrer. Voir docs/CONNAISSANCE.md pour l'allumer.
      enabled: false
      top-k: 4
      similarity-threshold: 0.6
      store-path: ""

    memory:
      # Mémoire long-terme du modèle (outils remember_fact / recall_facts), distincte de la fenêtre
      # de conversation (max-history-messages). Allumée par défaut : contrairement à la base de
      # connaissance, elle n'exige aucune infrastructure de plus que l'agent lui-même.
      enabled: true
      capacity: 200
      max-content-length: 500
      retention: 30d
      skills:
        # Ce que la bibliothèque de compétences approuvées pèse dans le prompt. Elle ne fait que
        # grandir — chaque échange réussi en propose une — alors que seules les `injected` premières
        # agissent : ce sont les plus récemment approuvées, et GET /api/agent/skills/curation dit
        # lesquelles dorment au-delà. Le retrait reste un geste humain, jamais une purge planifiée.
        injected: 5
        characters-per-skill: 3000
        stale-after: 90d

    supervision:
      # Le Control Center : observer, comprendre, décider, agir, vérifier. Allumé par défaut — il
      # n'exige aucune infrastructure de plus que l'agent lui-même.
      enabled: true
      # Rien n'est surveillé tant que rien n'est déclaré : l'agent ne devine pas les processus
      # d'intégration d'une installation, et un tableau de bord vide vaut mieux qu'inventé.
      processes: []
        # - id: order-integration
        #   name: Order Integration
        #   description: Commandes reçues du site vers l'ERP
        #   hint: topic integration.events, consumer group integration-consumer
      # Le mode ne peut que restreindre l'autonomie déclarée d'une capacité, jamais l'élargir.
      mode: SUPERVISED
      # En deçà, une action autonome repasse en validation humaine plutôt que de s'exécuter.
      confidence-threshold: 0.85
      thresholds:
        consumer-lag: 1000
        error-rate-percent: 2.0
        processing-time: 5m
        blocked-messages: 50
        observation-window: 15m
      # Toute capacité non citée est interdite. Même posture que l'API, qui refuse sans clé
      # plutôt que de s'ouvrir : le droit d'agir ne s'hérite pas d'une installation.
      autonomy: {}
        # NOTIFY: AUTOMATIC
        # RESTART_CONSUMER: SUPERVISED
      # Plancher de confiance propre à une capacité : « redémarrer un consumer » mérite plus de
      # certitude que « notifier ». Un réglage ici ne peut que relever le plancher global, jamais
      # l'abaisser — sinon il affaiblirait en silence la garantie que le plancher global porte.
      confidence-thresholds: {}
        # RESTART_CONSUMER: 0.95
      # Sans outil lié, une capacité reste recommandable mais inexécutable — et le dit.
      # Le serveur MCP de Kafka SQL Explorer n'expose que des outils de lecture : aucune capacité
      # n'y a de contrepartie, et devant lui l'agent observe sans agir. Lier une action suppose un
      # autre serveur MCP (ordonnanceur, runbook, ITSM).
      actions: {}
        # RESTART_CONSUMER:
        #   connection: mon-ordonnanceur
        #   tool: restart_consumer_group
      # Historique en mémoire du processus, donc mono-instance. Voir docs/ARCHITECTURE.md.
      history-size: 200
      # Une validation arrivée bien après les faits agirait sur une situation qui n'existe plus.
      approval-timeout: 30m
      # Au-delà, l'interface signale des données potentiellement obsolètes.
      stale-after: 15m
      schedule:
        # Départ autonome du cycle, derrière un verrou partagé. N'a d'effet que sous le profil
        # shared-memory, seul endroit où ce verrou (en base) peut exister. Voir SupervisionScheduler.
        enabled: false
        interval: 5m
        # Le verrou expire de lui-même après ce délai : sans cela, une réplique qui tombe en plein
        # cycle le garderait pris indéfiniment, et plus aucune autre instance ne pourrait relancer
        # l'analyse.
        lock-at-most-for: 10m
        adaptive:
          # Le battement ci-dessus reste régulier ; ceci décide seulement s'il y a lieu d'analyser.
          # Une cadence unique doit choisir entre réagir vite à un incident et ménager le budget de
          # jetons quand tout va bien : indexer le délai minimum sur ce que le dernier cycle a vu
          # lève ce compromis. Un cycle en échec compte comme dégradé — il n'affirme rien.
          enabled: false
          degraded: 5m
          healthy: 30m
      notify:
        # Débouché par défaut de la capacité NOTIFY quand aucun outil MCP ne lui est lié : c'est la
        # seule capacité dont le système cible est une personne, pas un système au schéma propre.
        # Vide, rien ne part.
        webhook-url: ""
        webhook-token: ""
      auto-adjust:
        # Durcit tout seul le plancher de confiance d'une capacité qui se fait rejeter plus souvent
        # qu'approuver. Ne peut que relever, jamais abaisser — même règle que confidence-thresholds
        # ci-dessus, dont il ne fait qu'automatiser un cas d'usage.
        enabled: true
        min-samples: 5
        min-relevance: 0.5
        increment: 0.05
      learning:
        # Un plancher qui monte dit « moins souvent », jamais *ce que* l'humain reprochait : seul le
        # motif de refus le dit. Au-delà de `min-refusals` refus concordants sur une même capacité,
        # une compétence candidate reprend ces motifs — en attente d'approbation, comme toute
        # compétence, et jamais active d'elle-même.
        enabled: true
        min-refusals: 3
        window: 30d

    rate-limit:
      # Limite d'instance, pas par appelant : le bearer est unique et partagé. Elle protège le
      # budget ; en multi-instance, diviser le seuil par le nombre de répliques.
      enabled: true
      requests-per-minute: 60
      burst: 20
    max-history-messages: 40
    # La fenêtre ci-dessus borne un nombre de messages, jamais leur taille : sans ce plafond, une
    # trace d'exception collée dans la conversation repart dans le prompt de chaque tour suivant
    # jusqu'à sortir de la fenêtre. Coupé à l'écriture seulement — le tour en cours voit tout.
    max-message-characters: 4000
    log-interactions: false

    token-budget:
      # 0 = illimité. Tenu en mémoire, par instance : diviser le seuil en multi-instance, comme
      # pour rate-limit ci-dessus. Le seul frein d'un cycle qui part sans clic (schedule.enabled).
      daily-limit: 0

logging:
  level:
    # SimpleLoggerAdvisor écrit en DEBUG : sans cette ligne, kex.agent.log-interactions=true posait
    # l'advisor sans qu'une seule ligne n'apparaisse au niveau par défaut — la propriété promettait
    # des journaux vides, et la console avertissait d'une fuite de prompts qui n'existait pas.
    # L'advisor n'est enregistré que lorsque la propriété est vraie (AgentConfig) : ce niveau ne
    # fait donc rien tant qu'elle reste fausse.
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Les routes sont peu nombreuses : les déplier évite un clic pour rien.
    doc-expansion: list

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # Distingue les instances dans un Prometheus partagé.
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 0 par défaut : le pont de traçage crée un Tracer même sans collecteur en face, mais rien
      # n'est exporté tant qu'aucune installation n'en déclare un explicitement. Un cycle traverse
      # contrôleur, ChatClient, appels MCP et modèle ; sans traçage, seules des métriques agrégées
      # les relient, jamais une trace corrélée d'une requête précise.
      probability: ${KEX_AGENT_TRACING_SAMPLING:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${KEX_AGENT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  # /actuator/prometheus n'est pas en permitAll : il porte le modèle utilisé, le volume de jetons
  # et les outils appelés. Le scraper doit présenter le même bearer que l'API.
