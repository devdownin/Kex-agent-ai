# Mémoire de conversation partagée entre instances (PostgreSQL).
#
#   SPRING_PROFILES_ACTIVE=shared-memory
#   SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/kex
#
# La liste d'exclusions remplace celle d'application.yml : une liste n'est pas fusionnée entre
# sources de propriétés, la source la plus prioritaire gagne en entier.
spring:
  autoconfigure:
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kex}
    username: ${SPRING_DATASOURCE_USERNAME:kex}
    password: ${SPRING_DATASOURCE_PASSWORD:kex}
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  # Migrations des tables propres à l'agent (V1__baseline.sql et ce qui suivra). baseline-version
  # à 0, sous la première migration, plutôt que le défaut à 1 : V1 doit réellement s'exécuter, pas
  # être sautée comme « déjà là » — c'est elle qui écrit ce qui manque encore sur une base qui
  # tournait déjà sous une version antérieure à cette migration, via ses `IF NOT EXISTS`. Sur une
  # base neuve elle s'exécute tout autant, et crée tout normalement.
  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
