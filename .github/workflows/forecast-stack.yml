name: Forecast stack
on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'compose/forecasts.yml'
      - 'compose/forecast-ci.yml'
      - 'bin/forecast-*.sh'
      - 'scripts/forecast-stack.py'
      - 'scripts/forecast-demo-seed.sh'
      - 'ci/forecast-stack*'
      - 'Dockerfile'
      - 'src/main/java/com/kex/agent/kafka/**'
      - 'src/main/resources/application.yml'
      - 'src/main/resources/static/index.html'
      - '.github/workflows/forecast-stack.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecast-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: forecast-ci
      ANTHROPIC_API_KEY: ci-dummy
      TIMESFM_CPUS: '2.0'
      TIMESFM_THREADS: '2'
      TIMESFM_MEM_LIMIT: 6g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3
      - name: Check diagnostic failure modes
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Prepare private credentials
        run: bin/forecast-stack.sh --prepare-only
      - name: Validate and build real components
        run: |
          docker compose --env-file .forecast-stack/.env -f docker-compose.yml -f compose/forecasts.yml -f compose/forecast-ci.yml config --quiet
          docker compose --env-file .forecast-stack/.env -f docker-compose.yml -f compose/forecasts.yml -f compose/forecast-ci.yml build
      - name: Start isolated stack
        run: |
          docker compose --env-file .forecast-stack/.env -f docker-compose.yml -f compose/forecasts.yml -f compose/forecast-ci.yml up -d
          python3 scripts/forecast-stack.py wait --timeout 300
      - name: Prepare demo and verify end-to-end connections
        run: |
          python3 scripts/forecast-stack.py demo
          python3 ci/forecast-stack-smoke.py
      - name: Service state on failure
        if: failure()
        run: bin/forecast-diagnose.sh || true
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose --env-file .forecast-stack/.env -f docker-compose.yml -f compose/forecasts.yml -f compose/forecast-ci.yml down -v --remove-orphans
