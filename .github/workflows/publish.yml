name: Publish

# Publication de l'image sur Docker Hub.
#
# Rien à saisir au déclenchement : la version est celle de `pom.xml`, lue par Maven. Une version
# tapée à la main finit par diverger du jar qu'elle étiquette, et une image mal étiquetée est pire
# qu'une image absente — personne ne saura ce qui tourne.
#
# Deux déclencheurs, deux politiques :
#   - un tag `vX.Y.Z` publie une version, avec ses tags mobiles ;
#   - un lancement manuel publie `edge` et l'empreinte du commit, jamais `latest`.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # L'image n'est pas publiée sans que la suite soit passée sur la même révision. Le workflow CI
  # ne se déclenche pas sur un tag — il ne couvre que `main` et les pull requests — donc s'y fier
  # publierait au mieux le résultat d'une autre révision.
  verify:
    if: github.repository == 'devdownin/Kex-agent-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Le nom du dépôt d'images et l'identifiant sont des variables, le jeton un secret : un nom
      # d'utilisateur n'est pas un secret, et le ranger comme tel le rend invisible dans les
      # journaux au moment où on cherche pourquoi l'authentification a échoué.
      - name: Resolve the destination
        id: destination
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          namespace="${NAMESPACE:-compagnonsdudev}"
          image="${IMAGE:-kex-agent-ai}"
          if [ -z "${USERNAME}" ]; then
            echo "::error::La variable DOCKERHUB_USERNAME est vide. Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "repository=${namespace}/${image}" >> "$GITHUB_OUTPUT"
          echo "Image : ${namespace}/${image}"

      # La version vient du projet, jamais d'une saisie. Sur un tag, les deux doivent coïncider :
      # un `v0.3.0` posé sur un pom resté en 0.2.0 publierait une image qui ment sur son contenu,
      # et le tag Git n'est pas récupérable une fois poussé.
      - name: Resolve the version and the tags
        id: version
        run: |
          set -euo pipefail
          # La dernière ligne non vide : un avertissement de Maven en tête de sortie deviendrait
          # sinon une partie de la version, et le tag publié serait illisible.
          version="$(./mvnw -B -q --no-transfer-progress help:evaluate \
            -Dexpression=project.version -DforceStdout | tr -d '\r' | grep -v '^$' | tail -1)"
          echo "Version du projet : ${version}"

          repository="${{ steps.destination.outputs.repository }}"
          short="$(git rev-parse --short HEAD)"
          tags="${repository}:sha-${short}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version du pom (${version}). Aligner l'un sur l'autre avant de republier."
              exit 1
            fi
            case "$version" in
              *SNAPSHOT*)
                echo "::error::Une version SNAPSHOT ne se publie pas : son contenu change sous le même nom."
                exit 1
                ;;
            esac
            tags="${tags},${repository}:${version}"
            # Les tags mobiles n'accompagnent qu'une version finale. Faire pointer `latest` sur une
            # préversion enverrait un `docker pull` sans tag sur du code qu'on n'a pas fini de juger.
            case "$version" in
              *-*)
                echo "Préversion : ni latest ni tags mobiles."
                ;;
              [0-9]*.[0-9]*.[0-9]*)
                major="${version%%.*}"
                minor="${version%.*}"
                tags="${tags},${repository}:${minor},${repository}:${major},${repository}:latest"
                ;;
              # Une version qui n'est pas en trois nombres n'a pas de tags mobiles évidents :
              # publier `:1` depuis « 1.2 » ou « 2026.03 » inventerait une hiérarchie.
              *)
                echo "Version hors du format X.Y.Z : version exacte seulement."
                ;;
            esac
          else
            # Hors tag, `edge` désigne « la dernière construite », ce qu'elle est vraiment.
            tags="${tags},${repository}:edge"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Tags publiés : ${tags}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # `docker login` plutôt que docker/login-action : une action de moins à épingler et à suivre
      # pour deux lignes de shell, et le jeton ne transite que par l'entrée standard.
      - name: Log in to Docker Hub
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::Le secret DOCKERHUB_TOKEN est vide. Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          printf '%s' "${TOKEN}" | docker login --username "${USERNAME}" --password-stdin

      # `linux/amd64` seulement. Une image arm64 supposerait QEMU et une compilation Maven émulée,
      # soit un ordre de grandeur de plus sur la durée : c'est une omission délibérée, pas un oubli.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Kex Agent AI
            org.opencontainers.image.description=Agent IA outillé par MCP, branché sur Kafka SQL Explorer
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # L'image est retirée du registre et relue : un `push` réussi dit que les couches sont
      # parties, pas que le manifeste est servable sous le tag attendu.
      - name: The published image must start
        run: |
          set -euo pipefail
          published="${{ steps.destination.outputs.repository }}:sha-$(git rev-parse --short HEAD)"
          docker rmi "$published" > /dev/null 2>&1 || true
          docker pull "$published"
          docker run -d --name kex-agent-published -p 8081:8081 \
            -e ANTHROPIC_API_KEY=publish-dummy -e KEX_AGENT_API_KEY=publish-secret \
            "$published"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8081/actuator/health
          docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$published"

      - name: Published image logs on failure
        if: failure()
        run: docker logs kex-agent-published || true

      - name: Stop the published image
        if: always()
        run: docker rm -f kex-agent-published || true

      - name: Log out
        if: always()
        run: docker logout || true
